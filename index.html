<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mamoball 2D - Realistic AI & SIUUU</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111827;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 1280px;
            max-height: 720px;
            display: flex;
            flex-direction: column;
            background: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 12px;
            overflow: hidden;
        }

        /* HUD Header */
        #hud {
            height: 60px;
            background: #1f2937;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            border-bottom: 2px solid #374151;
            z-index: 10;
        }

        .team-hud {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .team-color-indicator {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid #fff;
        }

        .stamina-bar-bg {
            width: 80px;
            height: 8px;
            background: #4b5563;
            border-radius: 4px;
            overflow: hidden;
        }

        .stamina-bar-fill {
            height: 100%;
            width: 100%;
            background: #10b981;
            transition: width 0.1s linear;
        }

        #score-board {
            background: #111827;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 2px;
            border: 1px solid #374151;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #timer {
            font-size: 0.9rem;
            color: #9ca3af;
            font-weight: normal;
        }

        /* Canvas */
        #canvas-wrapper {
            position: relative;
            flex: 1;
            width: 100%;
            height: calc(100% - 60px);
            display: flex;
            justify-content: center;
            align-items: center;
            background: #15803d;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Modals & Menus */
        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(17, 24, 39, 0.94);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            padding: 20px;
            text-align: center;
            overflow-y: auto;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #f59e0b;
            text-shadow: 0 4px 10px rgba(245, 158, 11, 0.3);
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 12px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 340px;
        }

        .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 18px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .btn:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .btn-secondary { background: #4b5563; }
        .btn-secondary:hover { background: #374151; }

        .btn-success { background: #059669; }
        .btn-success:hover { background: #047857; }

        .settings-box {
            background: #1f2937;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #374151;
            margin-bottom: 15px;
            width: 100%;
            max-width: 340px;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .setting-row:last-child { margin-bottom: 0; }

        select, input[type="text"] {
            background: #374151;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #4b5563;
            font-size: 0.95rem;
            outline: none;
            text-align: center;
        }

        .status-box {
            margin: 10px 0 15px 0;
            padding: 8px 14px;
            background: #1f2937;
            border-radius: 6px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #374151;
        }

        .status-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #eab308;
        }
        .status-dot.online { background: #10b981; }
        .status-dot.error { background: #ef4444; }

        /* Touch Controls */
        #touch-controls {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 15;
            display: none;
        }

        .joystick-zone {
            position: absolute;
            bottom: 20px; left: 20px;
            width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            pointer-events: auto;
            touch-action: none;
        }

        .joystick-stick {
            position: absolute;
            top: 50%; left: 50%;
            width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        .action-buttons {
            position: absolute;
            bottom: 25px; right: 25px;
            display: flex; gap: 15px;
            pointer-events: auto;
        }

        .touch-btn {
            width: 65px; height: 65px;
            border-radius: 50%;
            background: rgba(37, 99, 235, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: white; font-weight: bold;
            display: flex; justify-content: center; align-items: center;
            font-size: 0.9rem;
            touch-action: manipulation;
        }

        .touch-btn-boost { background: rgba(16, 185, 129, 0.7); }
    </style>
</head>
<body>

<div id="game-container">
    <!-- HUD -->
    <div id="hud">
        <div class="team-hud">
            <div class="team-color-indicator" style="background: #ef4444;"></div>
            <span>КРАСНЫЕ</span>
            <div class="stamina-bar-bg"><div id="stamina-red" class="stamina-bar-fill"></div></div>
        </div>

        <div id="score-board">
            <span id="score-red">0</span>
            <span>:</span>
            <span id="score-blue">0</span>
            <span id="timer">03:00</span>
        </div>

        <div class="team-hud">
            <div class="stamina-bar-bg"><div id="stamina-blue" class="stamina-bar-fill"></div></div>
            <span>СИНИЕ</span>
            <div class="team-color-indicator" style="background: #3b82f6;"></div>
        </div>
    </div>

    <!-- Canvas Field -->
    <div id="canvas-wrapper">
        <canvas id="gameCanvas" width="1000" height="550"></canvas>

        <!-- Touch Controls -->
        <div id="touch-controls">
            <div class="joystick-zone" id="joystick">
                <div class="joystick-stick" id="joystick-stick"></div>
            </div>
            <div class="action-buttons">
                <div class="touch-btn touch-btn-boost" id="btn-boost">БУСТ</div>
                <div class="touch-btn" id="btn-kick">УДАР</div>
            </div>
        </div>
    </div>

    <!-- Main Menu Modal -->
    <div id="menu-modal" class="modal">
        <h1>MAMOBALL 2D</h1>

        <div class="settings-box">
            <div class="setting-row">
                <span>Игроков у Красных:</span>
                <select id="red-count">
                    <option value="1">1</option>
                    <option value="2" selected>2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                </select>
            </div>
            <div class="setting-row">
                <span>Игроков у Синих:</span>
                <select id="blue-count">
                    <option value="1">1</option>
                    <option value="2" selected>2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                </select>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-success" onclick="startAIMatch()">Матч против ИИ</button>
            <button class="btn" onclick="openOnlineMenu()">Играть По Сети (Онлайн)</button>
            <button class="btn btn-secondary" onclick="startLocalMatch()">Локально (2 игрока на 1 ПК)</button>
        </div>
    </div>

    <!-- Online Lobby Modal -->
    <div id="online-modal" class="modal hidden">
        <h2>Онлайн Сеть (P2P)</h2>

        <div class="status-box">
            <div id="status-dot" class="status-dot"></div>
            <span id="status-text">Подключение...</span>
        </div>

        <div class="btn-group" id="online-controls">
            <button class="btn" onclick="createRoom()">Создать комнату</button>
            <hr style="border-color: #374151; margin: 4px 0;">
            <input type="text" id="room-input" placeholder="Код комнаты..." maxlength="6">
            <button class="btn btn-success" onclick="joinRoom()">Войти по коду</button>
            <button class="btn btn-secondary" onclick="backToMenu()">Назад</button>
        </div>

        <div id="room-created-info" class="hidden" style="margin-top: 10px;">
            <p>Код вашей комнаты:</p>
            <h1 id="room-code-display" style="letter-spacing: 4px; font-size: 2.2rem; margin: 8px 0;">------</h1>
            <p style="color: #9ca3af; font-size: 0.85rem; margin-bottom: 12px;">Ждём подключения второго игрока...</p>
            <button class="btn btn-secondary" onclick="cancelRoom()">Отмена</button>
        </div>
    </div>

    <!-- Goal / End Game Modal -->
    <div id="message-overlay" class="modal hidden" style="background: rgba(0,0,0,0.6);">
        <h1 id="message-title" style="font-size: 3.5rem;">ГОЛ!</h1>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const FIELD = { width: 1000, height: 550, padding: 50, goalWidth: 140, goalDepth: 30 };

    let mode = 'AI'; // 'AI', 'LOCAL', 'HOST', 'CLIENT'
    let isRunning = false;
    let scoreRed = 0, scoreBlue = 0;
    let gameTime = 180;
    let timerInterval = null;
    let aiTimer = 0; // Таймер анимации поведения ИИ

    let players = [];
    const ball = { x: FIELD.width / 2, y: FIELD.height / 2, vx: 0, vy: 0, radius: 12, color: '#ffffff', friction: 0.985 };

    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
        document.getElementById('touch-controls').style.display = 'block';
        setupTouchControls();
    }

    // --- Web Audio Synthesizer: SIUUUU! Goal Celebration ---
    function playSiuuuSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const now = audioCtx.currentTime;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(180, now + 0.4);
            osc.frequency.exponentialRampToValueAtTime(650, now + 1.2);

            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 1.5);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 1.5);
        } catch (e) {
            console.log("Audio Context Blocked", e);
        }
    }

    // --- PeerJS Online Network ---
    let peer = null, conn = null, myPeerId = '';
    const peerServers = [
        undefined,
        { host: '0.peerjs.com', port: 443, path: '/', secure: true }
    ];
    let serverIndex = 0;

    function initPeerJS() {
        const statusText = document.getElementById('status-text');
        const statusDot = document.getElementById('status-dot');
        statusText.innerText = "Подключение...";
        statusDot.className = "status-dot";

        if (peer) peer.destroy();
        const shortId = Math.floor(100000 + Math.random() * 900000).toString();

        try { peer = new Peer(shortId, peerServers[serverIndex]); }
        catch (e) { tryNextServer(); return; }

        peer.on('open', (id) => {
            myPeerId = id;
            statusText.innerText = "Готов к игре";
            statusDot.className = "status-dot online";
        });

        peer.on('connection', (connection) => {
            conn = connection;
            setupHostConnection();
        });

        peer.on('error', () => tryNextServer());
    }

    function tryNextServer() {
        serverIndex++;
        if (serverIndex < peerServers.length) initPeerJS();
        else {
            document.getElementById('status-text').innerText = "Ошибка подключения";
            document.getElementById('status-dot').className = "status-dot error";
        }
    }

    function openOnlineMenu() {
        document.getElementById('menu-modal').classList.add('hidden');
        document.getElementById('online-modal').classList.remove('hidden');
        if (!peer || peer.destroyed) initPeerJS();
    }

    function backToMenu() {
        document.getElementById('online-modal').classList.add('hidden');
        document.getElementById('menu-modal').classList.remove('hidden');
    }

    function createRoom() {
        if (!myPeerId) return;
        mode = 'HOST';
        document.getElementById('online-controls').classList.add('hidden');
        document.getElementById('room-created-info').classList.remove('hidden');
        document.getElementById('room-code-display').innerText = myPeerId;
    }

    function cancelRoom() {
        document.getElementById('room-created-info').classList.add('hidden');
        document.getElementById('online-controls').classList.remove('hidden');
        mode = 'AI';
    }

    function joinRoom() {
        const code = document.getElementById('room-input').value.trim();
        if (!code || code.length < 5) return;
        mode = 'CLIENT';
        conn = peer.connect(code);
        setupClientConnection();
    }

    function setupHostConnection() {
        conn.on('open', () => {
            document.getElementById('online-modal').classList.add('hidden');
            const redN = parseInt(document.getElementById('red-count').value);
            const blueN = parseInt(document.getElementById('blue-count').value);
            initTeams(redN, blueN);
            resetGame();
            isRunning = true;
            startTimer();
        });

        conn.on('data', (data) => {
            if (data.type === 'INPUT') {
                const guestPlayer = players.find(p => p.team === 'blue');
                if (guestPlayer) updatePlayerFromInput(guestPlayer, data.input);
            }
        });
    }

    function setupClientConnection() {
        conn.on('open', () => {
            document.getElementById('online-modal').classList.add('hidden');
            resetGame();
            isRunning = true;
        });

        conn.on('data', (data) => {
            if (data.type === 'STATE') {
                ball.x = data.ball.x; ball.y = data.ball.y;
                scoreRed = data.scoreRed; scoreBlue = data.scoreBlue;
                gameTime = data.gameTime;
                data.players.forEach((pData, idx) => {
                    if (players[idx]) {
                        players[idx].x = pData.x;
                        players[idx].y = pData.y;
                    }
                });
                updateHUD();
            } else if (data.type === 'GOAL') {
                handleGoal(data.text);
            }
        });
    }

    // --- Team Setup ---
    function initTeams(redNum, blueNum) {
        players = [];
        for (let i = 0; i < redNum; i++) {
            players.push({
                id: i, team: 'red',
                x: 200 + (i === 0 ? 0 : -60),
                y: FIELD.height / 2 + (i === 0 ? 0 : (i % 2 === 0 ? 80 * i : -80 * i)),
                vx: 0, vy: 0, radius: 20, color: '#ef4444', speed: 4.2, stamina: 100, isKicking: false
            });
        }
        for (let i = 0; i < blueNum; i++) {
            players.push({
                id: redNum + i, team: 'blue',
                x: FIELD.width - 200 + (i === 0 ? 0 : 60),
                y: FIELD.height / 2 + (i === 0 ? 0 : (i % 2 === 0 ? 80 * i : -80 * i)),
                vx: 0, vy: 0, radius: 20, color: '#3b82f6', speed: 4.2, stamina: 100, isKicking: false
            });
        }
    }

    function startAIMatch() {
        mode = 'AI';
        const redN = parseInt(document.getElementById('red-count').value);
        const blueN = parseInt(document.getElementById('blue-count').value);
        initTeams(redN, blueN);
        document.getElementById('menu-modal').classList.add('hidden');
        resetGame();
        isRunning = true;
        startTimer();
    }

    function startLocalMatch() {
        mode = 'LOCAL';
        initTeams(1, 1);
        document.getElementById('menu-modal').classList.add('hidden');
        resetGame();
        isRunning = true;
        startTimer();
    }

    function resetGame() {
        scoreRed = 0; scoreBlue = 0; gameTime = 180;
        resetPositions();
        updateHUD();
    }

    function resetPositions() {
        ball.x = FIELD.width / 2; ball.y = FIELD.height / 2;
        ball.vx = 0; ball.vy = 0;

        let rIdx = 0, bIdx = 0;
        players.forEach(p => {
            p.vx = 0; p.vy = 0;
            if (p.team === 'red') {
                p.x = 220 + (rIdx === 0 ? 0 : -70);
                p.y = FIELD.height / 2 + (rIdx === 0 ? 0 : (rIdx % 2 === 0 ? 90 * rIdx : -90 * rIdx));
                rIdx++;
            } else {
                p.x = FIELD.width - 220 - (bIdx === 0 ? 0 : -70);
                p.y = FIELD.height / 2 + (bIdx === 0 ? 0 : (bIdx % 2 === 0 ? 90 * bIdx : -90 * bIdx));
                bIdx++;
            }
        });
    }

    function startTimer() {
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (!isRunning) return;
            if (mode !== 'CLIENT') {
                gameTime--;
                if (gameTime <= 0) {
                    gameTime = 0; isRunning = false;
                    showMessage("МАТЧ ОКОНЧЕН!");
                    setTimeout(() => {
                        document.getElementById('message-overlay').classList.add('hidden');
                        document.getElementById('menu-modal').classList.remove('hidden');
                    }, 3000);
                }
            }
        }, 1000);
    }

    function updateHUD() {
        document.getElementById('score-red').innerText = scoreRed;
        document.getElementById('score-blue').innerText = scoreBlue;

        const m = Math.floor(gameTime / 60).toString().padStart(2, '0');
        const s = (gameTime % 60).toString().padStart(2, '0');
        document.getElementById('timer').innerText = `${m}:${s}`;

        const p1 = players.find(p => p.team === 'red');
        const p2 = players.find(p => p.team === 'blue');
        if (p1) document.getElementById('stamina-red').style.width = `${p1.stamina}%`;
        if (p2) document.getElementById('stamina-blue').style.width = `${p2.stamina}%`;
    }

    function showMessage(text) {
        const overlay = document.getElementById('message-overlay');
        document.getElementById('message-title').innerText = text;
        overlay.classList.remove('hidden');
    }

    // --- Inputs & Realist AI Movement ---
    let touchInput = { dx: 0, dy: 0, kick: false, boost: false };

    function getP1Input() {
        const inp = {
            up: keys['KeyW'] || false, down: keys['KeyS'] || false,
            left: keys['KeyA'] || false, right: keys['KeyD'] || false,
            kick: keys['Space'] || keys['KeyX'] || false,
            boost: keys['ShiftLeft'] || keys['ShiftRight'] || false
        };
        if (touchInput.dx !== 0 || touchInput.dy !== 0) {
            inp.touchDx = touchInput.dx; inp.touchDy = touchInput.dy;
        }
        if (touchInput.kick) inp.kick = true;
        if (touchInput.boost) inp.boost = true;
        return inp;
    }

    function updatePlayerFromInput(p, input) {
        let moveX = 0, moveY = 0;
        if (input.up) moveY -= 1; if (input.down) moveY += 1;
        if (input.left) moveX -= 1; if (input.right) moveX += 1;
        if (input.touchDx) { moveX = input.touchDx; moveY = input.touchDy; }

        let currentSpeed = p.speed;
        if (input.boost && p.stamina > 5) {
            currentSpeed *= 1.6;
            p.stamina = Math.max(0, p.stamina - 0.7);
        } else {
            p.stamina = Math.min(100, p.stamina + 0.3);
        }

        p.vx = moveX * currentSpeed;
        p.vy = moveY * currentSpeed;
        p.isKicking = input.kick;
    }

    function updatePhysics() {
        if (!isRunning) return;

        aiTimer += 0.05; // Счётчик для случайных колебаний ИИ
        const p1Inp = getP1Input();

        if (mode === 'CLIENT') {
            if (conn && conn.open) conn.send({ type: 'INPUT', input: p1Inp });
            return;
        }

        // Человек Игрок 1
        if (players[0]) updatePlayerFromInput(players[0], p1Inp);

        if (mode === 'LOCAL') {
            const p2Inp = {
                up: keys['ArrowUp'] || false, down: keys['ArrowDown'] || false,
                left: keys['ArrowLeft'] || false, right: keys['ArrowRight'] || false,
                kick: keys['Enter'] || keys['KeyM'] || false,
                boost: keys['ControlRight'] || keys['KeyK'] || false
            };
            if (players[1]) updatePlayerFromInput(players[1], p2Inp);
        } else {
            // УЛУЧШЕННЫЙ УМНЫЙ ИИ (Без циклов и мгновенной реактивности)
            players.forEach((p, idx) => {
                if (idx === 0) return; // Человек Игрок 1
                if (mode === 'HOST' && p.team === 'blue' && idx === players.findIndex(pl => pl.team === 'blue')) return; // Гость в онлайне

                let targetX = ball.x;
                let targetY = ball.y;

                // Разделяем роли для устранения зацикливания
                const teamIndex = players.filter((item, i) => i < idx && item.team === p.team).length;

                if (teamIndex === 0) {
                    // Форвард - бежит за мячом с плавным волнистым движением
                    targetX = ball.x;
                    targetY = ball.y + Math.sin(aiTimer + idx) * 15;
                } else if (teamIndex === 1) {
                    // Защитник - держит линию между мячом и своими воротами
                    const ownGoalX = (p.team === 'red') ? FIELD.padding : FIELD.width - FIELD.padding;
                    targetX = (ball.x + ownGoalX) / 2;
                    targetY = ball.y * 0.7 + (FIELD.height / 2) * 0.3;
                } else {
                    // Полузащитник - поддерживает середину
                    targetX = (p.team === 'red') ? Math.min(ball.x - 50, FIELD.width / 2) : Math.max(ball.x + 50, FIELD.width / 2);
                    targetY = ball.y + (idx % 2 === 0 ? 70 : -70);
                }

                let dx = targetX - p.x;
                let dy = targetY - p.y;
                let dist = Math.hypot(dx, dy);

                let desiredVx = 0;
                let desiredVy = 0;

                if (dist > 15) {
                    desiredVx = (dx / dist) * (p.speed * 0.75); // Снижаем резкую скорость ИИ
                    desiredVy = (dy / dist) * (p.speed * 0.75);
                }

                // Плавное сглаживание скорости (Инерция вместо цикличных разворотов)
                p.vx += (desiredVx - p.vx) * 0.1;
                p.vy += (desiredVy - p.vy) * 0.1;

                p.isKicking = Math.hypot(ball.x - p.x, ball.y - p.y) < p.radius + ball.radius + 8;
            });
        }

        // Движение и границы
        players.forEach(p => {
            p.x += p.vx; p.y += p.vy;
            p.x = Math.max(FIELD.padding + p.radius, Math.min(FIELD.width - FIELD.padding - p.radius, p.x));
            p.y = Math.max(FIELD.padding + p.radius, Math.min(FIELD.height - FIELD.padding - p.radius, p.y));
        });

        ball.x += ball.vx; ball.y += ball.vy;
        ball.vx *= ball.friction; ball.vy *= ball.friction;

        // Столкновения игроков с мячом
        players.forEach(p => {
            const dx = ball.x - p.x, dy = ball.y - p.y;
            const dist = Math.hypot(dx, dy);
            const minDist = p.radius + ball.radius;

            if (dist < minDist) {
                const overlap = minDist - dist;
                const nx = dx / (dist || 1), ny = dy / (dist || 1);
                ball.x += nx * overlap; ball.y += ny * overlap;
                let power = p.isKicking ? 13 : 5;
                ball.vx = nx * power + p.vx * 0.5;
                ball.vy = ny * power + p.vy * 0.5;
            }
        });

        // Стены и Голы
        const topY = FIELD.padding, bottomY = FIELD.height - FIELD.padding;
        const goalTop = FIELD.height / 2 - FIELD.goalWidth / 2;
        const goalBottom = FIELD.height / 2 + FIELD.goalWidth / 2;

        if (ball.y - ball.radius < topY) { ball.y = topY + ball.radius; ball.vy *= -0.8; }
        if (ball.y + ball.radius > bottomY) { ball.y = bottomY - ball.radius; ball.vy *= -0.8; }

        if (ball.x - ball.radius < FIELD.padding) {
            if (ball.y > goalTop && ball.y < goalBottom) {
                scoreBlue++; handleGoal('ГОЛ! СИНИЕ ЗАБИЛИ!');
            } else { ball.x = FIELD.padding + ball.radius; ball.vx *= -0.8; }
        }

        if (ball.x + ball.radius > FIELD.width - FIELD.padding) {
            if (ball.y > goalTop && ball.y < goalBottom) {
                scoreRed++; handleGoal('SIUUU! ГОЛ КРАСНЫХ!');
            } else { ball.x = FIELD.width - FIELD.padding - ball.radius; ball.vx *= -0.8; }
        }

        // Host Broadcast
        if (mode === 'HOST' && conn && conn.open) {
            conn.send({
                type: 'STATE',
                ball: { x: ball.x, y: ball.y },
                scoreRed, scoreBlue, gameTime,
                players: players.map(p => ({ x: p.x, y: p.y }))
            });
        }

        updateHUD();
    }

    function handleGoal(text) {
        isRunning = false;
        playSiuuuSound();
        showMessage(text);

        if (mode === 'HOST' && conn && conn.open) {
            conn.send({ type: 'GOAL', text });
        }

        setTimeout(() => {
            document.getElementById('message-overlay').classList.add('hidden');
            resetPositions();
            isRunning = true;
        }, 2200);
    }

    function render() {
        ctx.clearRect(0, 0, FIELD.width, FIELD.height);

        // Газон
        ctx.fillStyle = '#15803d';
        ctx.fillRect(0, 0, FIELD.width, FIELD.height);

        // Разметка поля
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
        ctx.lineWidth = 4;
        ctx.strokeRect(FIELD.padding, FIELD.padding, FIELD.width - FIELD.padding * 2, FIELD.height - FIELD.padding * 2);

        ctx.beginPath();
        ctx.moveTo(FIELD.width / 2, FIELD.padding);
        ctx.lineTo(FIELD.width / 2, FIELD.height - FIELD.padding);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(FIELD.width / 2, FIELD.height / 2, 70, 0, Math.PI * 2);
        ctx.stroke();

        // Ворота
        const goalTop = FIELD.height / 2 - FIELD.goalWidth / 2;
        ctx.fillStyle = 'rgba(239, 68, 68, 0.2)';
        ctx.fillRect(FIELD.padding - FIELD.goalDepth, goalTop, FIELD.goalDepth, FIELD.goalWidth);
        ctx.strokeRect(FIELD.padding - FIELD.goalDepth, goalTop, FIELD.goalDepth, FIELD.goalWidth);

        ctx.fillStyle = 'rgba(59, 130, 246, 0.2)';
        ctx.fillRect(FIELD.width - FIELD.padding, goalTop, FIELD.goalDepth, FIELD.goalWidth);
        ctx.strokeRect(FIELD.width - FIELD.padding, goalTop, FIELD.goalDepth, FIELD.goalWidth);

        // Мяч
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fillStyle = ball.color;
        ctx.fill();
        ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();

        // Игроки
        players.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.fill();
            ctx.strokeStyle = p.isKicking ? '#f59e0b' : '#ffffff';
            ctx.lineWidth = p.isKicking ? 4 : 2;
            ctx.stroke();
        });
    }

    function loop() {
        updatePhysics();
        render();
        requestAnimationFrame(loop);
    }
    loop();

    function setupTouchControls() {
        const joystick = document.getElementById('joystick');
        const stick = document.getElementById('joystick-stick');
        const btnKick = document.getElementById('btn-kick');
        const btnBoost = document.getElementById('btn-boost');

        let touchId = null, startX = 0, startY = 0;

        joystick.addEventListener('touchstart', e => {
            const touch = e.changedTouches[0];
            touchId = touch.identifier;
            const rect = joystick.getBoundingClientRect();
            startX = rect.left + rect.width / 2;
            startY = rect.top + rect.height / 2;
        });

        window.addEventListener('touchmove', e => {
            if (touchId === null) return;
            for (let touch of e.changedTouches) {
                if (touch.identifier === touchId) {
                    let dx = touch.clientX - startX, dy = touch.clientY - startY;
                    let dist = Math.hypot(dx, dy), maxDist = 45;
                    if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
                    stick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                    touchInput.dx = dx / maxDist; touchInput.dy = dy / maxDist;
                }
            }
        });

        const resetJoystick = () => {
            touchId = null;
            stick.style.transform = 'translate(-50%, -50%)';
            touchInput.dx = 0; touchInput.dy = 0;
        };

        window.addEventListener('touchend', resetJoystick);
        window.addEventListener('touchcancel', resetJoystick);

        btnKick.addEventListener('touchstart', (e) => { e.preventDefault(); touchInput.kick = true; });
        btnKick.addEventListener('touchend', (e) => { e.preventDefault(); touchInput.kick = false; });

        btnBoost.addEventListener('touchstart', (e) => { e.preventDefault(); touchInput.boost = true; });
        btnBoost.addEventListener('touchend', (e) => { e.preventDefault(); touchInput.boost = false; });
    }
</script>
